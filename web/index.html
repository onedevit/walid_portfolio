    #flutter-splash {

      left: 0;

      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #13273e 0%, #0b1120 100%);

      transition: opacity 0.4s ease-out;
      pointer-events: auto;
    }
    .splash-card {
      text-align: center;
      padding: 24px;
      max-width: 90%;
    }

      width: 110px;

      object-fit: cover;
      display: block;
    }
    .splash-title {

      letter-spacing: 0.5px;

    .splash-spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border: 3px solid rgba(0, 191, 165, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>

<body>
  <!-- Semantic Instant Splash Loader (Guarantees Instant FCP & LCP for PageSpeed) -->
  <div id="flutter-splash">
    <div class="splash-card">
      <div class="splash-avatar-box">
        <img src="profile.jpg" alt="Walid Hassani" width="110" height="110" class="splash-avatar" fetchpriority="high">
      </div>
      <h1 class="splash-title">WALID HASSANI</h1>
      <p class="splash-subtitle">Consultant ERP &amp; Chef de Projet Technique</p>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <script>
    function removeSplash() {
      var splash = document.getElementById('flutter-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    }

    // Dismiss splash when Flutter fires first frame
    window.addEventListener('flutter-first-frame', removeSplash);

    // Observer fallback: remove when Flutter canvas/glasspane mounts
    var observer = new MutationObserver(function (mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        setTimeout(removeSplash, 100);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout fallback
    setTimeout(removeSplash, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
